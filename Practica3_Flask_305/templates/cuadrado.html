<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área y perímetro del cuadrado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header class="encabezado">
        <h1>Calculadora del cuadrado</h1>
        <nav class="menu">
            <a href="/cuadrado">Cuadrado</a>
        </nav>
    </header>

    <main class="contenedor">
        <section class="tarjeta-operacion">
            <h2>Área y perímetro del cuadrado</h2>

            <form method="POST">
                <label for="lado">Lado del cuadrado</label>
                <input id="lado"
                       name="lado"
                       type="number"
                       step="any"
                       value="{{ lado }}"
                       required
                       placeholder="Ej: 5">
                <button class="boton" type="submit">
                    Calcular
                </button>
            </form>

            {% if error %}
                <p class="resultado" style="color: red;">
                    {{ error }}
                </p>
            {% endif %}

            {% if area is not none %}
                <p class="resultado">
                    Área: {{ area }}
                </p>
                <p class="resultado">
                    Perímetro: {{ perimetro }}
                </p>
            {% endif %}
        </section>
    </main>
</body>
</html>
